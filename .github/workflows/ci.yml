name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.1
        env:
          POSTGRES_DB: policy_evidence_agent_test
          POSTGRES_USER: policy_agent
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U policy_agent -d policy_evidence_agent_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check
      - run: uv run pytest
        env:
          LLM_MODE: replay
          TEST_DATABASE_URL: postgresql://policy_agent:test-password@localhost:5432/policy_evidence_agent_test
