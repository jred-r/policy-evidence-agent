services:
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://litellm_admin:${DB_PASSWORD:?Set DB_PASSWORD in proxy .env}@litellm-db:5432/litellm_db?sslmode=disable
      LITELLM_API_BASE: http://litellm-proxy:4000
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in proxy .env}
      LLM_MODE: ${LLM_MODE:-replay}
      QA_CHROMA_PATH: /app/.qa/chroma
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - policy_evidence_chroma:/app/.qa/chroma
    restart: "no"
  mcp:
    build: .
    command: ["python", "-m", "qa.mcp_server"]
    profiles: ["mcp"]
    environment:
      DATABASE_URL: postgresql://litellm_admin:${DB_PASSWORD:?Set DB_PASSWORD in proxy .env}@litellm-db:5432/litellm_db?sslmode=disable
      LITELLM_API_BASE: http://litellm-proxy:4000
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in proxy .env}
      LLM_MODE: ${LLM_MODE:-replay}
      QA_CHROMA_PATH: /app/.qa/chroma
    volumes:
      - policy_evidence_chroma:/app/.qa/chroma
    restart: "no"

volumes:
  policy_evidence_chroma:

networks:
  default:
    name: litellm-enterprise-proxy_litellm-network
    external: true
