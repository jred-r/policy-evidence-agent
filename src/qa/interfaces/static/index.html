<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Policy Evidence Agent</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", sans-serif;
        color: var(--text);
        background: var(--app-bg);
        --app-bg: #f5f7fb;
        --panel-bg: #fff;
        --sidebar-bg: #fff;
        --text: #172033;
        --muted: #667085;
        --border: #e0e5ed;
        --hover: #edf3ff;
        --active-bg: #eaf1ff;
        --active-text: #173d89;
        --user-bg: #edf3ff;
        --user-border: #d3e0fa;
        --accent: #2458c6;
        --citation-bg: #f5f8fe;
        --error-text: #a32132;
        --error-border: #f0c8ce;
        --error-bg: #fff6f7;
        --shadow: #17203308;
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --app-bg: #111821;
        --panel-bg: #18212c;
        --sidebar-bg: #141c27;
        --text: #e8edf5;
        --muted: #a6b0bf;
        --border: #344052;
        --hover: #222e3d;
        --active-bg: #243b5d;
        --active-text: #dceaff;
        --user-bg: #1f3554;
        --user-border: #37577f;
        --accent: #4f83e5;
        --citation-bg: #202d3f;
        --error-text: #ffc2c9;
        --error-border: #69414a;
        --error-bg: #35242a;
        --shadow: #00000040;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        grid-template-columns: 280px minmax(0, 1fr);
        height: 100vh;
        margin: 0;
      }

      button,
      textarea {
        font: inherit;
      }

      button {
        cursor: pointer;
        color: inherit;
      }

      .sidebar {
        display: flex;
        flex-direction: column;
        min-height: 0;
        padding: 20px 14px;
        border-right: 1px solid var(--border);
        background: var(--sidebar-bg);
      }

      .brand {
        margin: 0 8px 18px;
        font-size: 1.05rem;
      }

      .brand p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 0.85rem;
      }

      #new-chat {
        width: 100%;
        padding: 11px 14px;
        border: 1px solid var(--border);
        border-radius: 9px;
        color: var(--active-text);
        background: var(--panel-bg);
        font-weight: 600;
        text-align: left;
      }

      #new-chat:hover,
      .session-button:hover,
      .side-nav:hover {
        background: var(--hover);
      }

      .side-nav {
        display: flex;
        width: 100%;
        justify-content: space-between;
        margin-top: 8px;
        padding: 9px 10px;
        border: 0;
        border-radius: 8px;
        color: var(--text);
        background: transparent;
        text-align: left;
      }

      .side-nav.active {
        color: var(--active-text);
        background: var(--active-bg);
      }

      .count-badge {
        min-width: 22px;
        padding: 1px 6px;
        border-radius: 999px;
        background: var(--border);
        font-size: 0.75rem;
        text-align: center;
      }

      .sidebar-heading {
        margin: 24px 8px 8px;
        color: var(--muted);
        font-size: 0.75rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      #session-list {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 4px;
        overflow-y: auto;
      }

      .session-row {
        display: flex;
        align-items: center;
        gap: 4px;
        min-width: 0;
      }

      .session-button {
        display: flex;
        min-width: 0;
        flex: 1;
        flex-direction: column;
        gap: 4px;
        width: 100%;
        padding: 10px;
        overflow: hidden;
        border: 0;
        border-radius: 8px;
        color: var(--text);
        background: transparent;
        text-align: left;
      }

      .session-delete {
        padding: 8px;
        border: 0;
        border-radius: 7px;
        color: var(--muted);
        background: transparent;
      }

      .session-delete:hover {
        color: var(--error-text);
        background: var(--error-bg);
      }

      .session-button.active {
        color: var(--active-text);
        background: var(--active-bg);
      }

      .session-title,
      .session-date {
        overflow: hidden;
        max-width: 100%;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .session-date {
        color: var(--muted);
        font-size: 0.75rem;
      }

      .main {
        display: flex;
        min-width: 0;
        min-height: 0;
        flex-direction: column;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 76px;
        padding: 14px 28px;
        border-bottom: 1px solid var(--border);
        background: var(--panel-bg);
      }

      .topbar h1 {
        margin: 0;
        font-size: 1.05rem;
      }

      .topbar p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 0.85rem;
      }

      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .setting-toggle {
        display: flex;
        align-items: center;
        gap: 7px;
        color: var(--text);
        cursor: pointer;
        font-size: 0.82rem;
        white-space: nowrap;
      }

      .setting-toggle input {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        opacity: 0;
      }

      .toggle-track {
        position: relative;
        width: 36px;
        height: 20px;
        flex: 0 0 36px;
        border-radius: 999px;
        background: var(--border);
        transition: background 0.15s ease;
      }

      .toggle-track::after {
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        content: "";
        transition: transform 0.15s ease;
      }

      .setting-toggle input:checked + .toggle-track {
        background: var(--accent);
      }

      .setting-toggle input:checked + .toggle-track::after {
        transform: translateX(16px);
      }

      .setting-toggle input:focus-visible + .toggle-track {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      #connection-status {
        color: var(--muted);
        font-size: 0.85rem;
      }

      #connection-status.error {
        color: var(--error-text);
      }

      #chat-log {
        display: flex;
        flex: 1;
        min-height: 0;
        flex-direction: column;
        gap: 22px;
        overflow-y: auto;
        padding: 30px 24px;
      }

      #empty-state {
        width: min(720px, 100%);
        margin: auto;
        color: var(--muted);
        text-align: center;
      }

      #empty-state h2 {
        margin-bottom: 8px;
        color: var(--text);
        font-size: 1.5rem;
      }

      .message {
        display: flex;
        width: min(820px, 100%);
        align-items: flex-start;
        gap: 12px;
        margin: 0 auto;
      }

      .message-role {
        flex: 0 0 72px;
        padding-top: 13px;
        color: var(--muted);
        font-size: 0.8rem;
        font-weight: 600;
      }

      .bubble {
        min-width: 0;
        max-width: 100%;
        padding: 14px 16px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--panel-bg);
        box-shadow: 0 2px 8px var(--shadow);
      }

      .message.user .bubble {
        border-color: var(--user-border);
        background: var(--user-bg);
      }

      .message.error .bubble {
        border-color: var(--error-border);
        background: var(--error-bg);
      }

      .message-content {
        margin: 0;
        line-height: 1.55;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }

      .message-meta {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 0.8rem;
      }

      .citation {
        margin: 10px 0 0;
        padding: 10px 12px;
        border-left: 3px solid #75a2ff;
        background: var(--citation-bg);
        font-size: 0.9rem;
        line-height: 1.45;
        overflow-wrap: anywhere;
      }

      .review-layout {
        display: grid;
        width: min(1050px, 100%);
        height: 100%;
        min-height: 0;
        grid-template-columns: minmax(210px, 0.7fr) minmax(0, 1.5fr);
        gap: 18px;
        margin: 0 auto;
      }

      .review-list,
      .review-detail,
      .activity-list {
        min-height: 0;
        overflow: auto;
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--panel-bg);
      }

      .review-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .review-item {
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        background: var(--panel-bg);
        text-align: left;
      }

      .review-item.active,
      .review-item:hover {
        border-color: var(--accent);
        background: var(--hover);
      }

      .review-item span,
      .activity-row span {
        display: block;
        margin-top: 5px;
        color: var(--muted);
        font-size: 0.78rem;
      }

      .review-detail h2,
      .review-detail h3 {
        margin: 0 0 10px;
      }

      .review-question {
        margin: 0 0 18px;
        line-height: 1.5;
        white-space: pre-wrap;
      }

      #review-answer {
        width: 100%;
        min-height: 150px;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 9px;
        color: var(--text);
        background: var(--app-bg);
        font: inherit;
        line-height: 1.5;
      }

      .review-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 14px;
      }

      .review-actions button,
      .activity-refresh {
        padding: 9px 14px;
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        background: var(--panel-bg);
      }

      .review-actions .approve {
        border-color: var(--accent);
        color: #fff;
        background: var(--accent);
      }

      .activity-list {
        width: min(1050px, 100%);
        margin: 0 auto;
      }

      .activity-row {
        padding: 12px 0;
        border-bottom: 1px solid var(--border);
      }

      .activity-row:last-child {
        border-bottom: 0;
      }

      .activity-event {
        overflow-wrap: anywhere;
        color: var(--muted);
        font-family: Consolas, monospace;
        font-size: 0.8rem;
      }

      #composer {
        padding: 18px 24px 20px;
        border-top: 1px solid var(--border);
        background: var(--panel-bg);
      }

      .composer-inner {
        display: flex;
        width: min(820px, 100%);
        align-items: flex-end;
        gap: 12px;
        margin: 0 auto;
      }

      #message-input {
        flex: 1;
        min-height: 48px;
        max-height: 180px;
        padding: 13px 14px;
        resize: vertical;
        border: 1px solid var(--border);
        border-radius: 10px;
        color: var(--text);
        background: var(--app-bg);
        line-height: 1.4;
      }

      #message-input:focus {
        border-color: #5783df;
        outline: 2px solid #5783df33;
      }

      #send {
        min-height: 48px;
        padding: 0 18px;
        border: 0;
        border-radius: 10px;
        color: #fff;
        background: var(--accent);
        font-weight: 600;
      }

      #send:disabled,
      #new-chat:disabled {
        opacity: 0.6;
        cursor: wait;
      }

      .composer-hint {
        width: min(820px, 100%);
        margin: 8px auto 0;
        color: var(--muted);
        font-size: 0.75rem;
      }

      @media (max-width: 760px) {
        body {
          grid-template-columns: 1fr;
          grid-template-rows: auto minmax(0, 1fr);
          height: 100vh;
        }

        .sidebar {
          max-height: 260px;
          padding: 12px;
          border-right: 0;
          border-bottom: 1px solid var(--border);
        }

        .brand {
          display: none;
        }

        .sidebar-heading {
          margin: 12px 4px 4px;
        }

        #session-list {
          min-height: 54px;
          flex-direction: row;
          overflow-x: auto;
          overflow-y: hidden;
        }

        .session-row {
          flex: 0 0 235px;
        }

        .session-button {
          flex: 1;
        }

        .review-layout {
          grid-template-columns: minmax(120px, 0.75fr) minmax(0, 1.25fr);
          gap: 8px;
        }

        .review-list,
        .review-detail,
        .activity-list {
          padding: 10px;
        }

        .topbar {
          align-items: flex-start;
          min-height: 62px;
          padding: 10px 16px;
        }

        .topbar-actions {
          flex-wrap: wrap;
          justify-content: flex-end;
          gap: 8px;
        }

        .setting-toggle {
          gap: 4px;
          font-size: 0.72rem;
        }

        #chat-log {
          padding: 22px 14px;
        }

        .message {
          gap: 6px;
        }

        .message-role {
          flex-basis: 54px;
          font-size: 0.72rem;
        }

        #composer {
          padding: 12px 14px;
        }

        .composer-inner {
          gap: 8px;
        }

        #send {
          padding: 0 12px;
        }
      }
    </style>
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand">
        <strong>Policy Evidence Agent</strong>
        <p>Answers grounded in your policies</p>
      </div>
      <button id="new-chat" type="button">+ New chat</button>
      <button id="review-nav" class="side-nav" type="button">
        <span>Human review</span><span id="review-count" class="count-badge">0</span>
      </button>
      <button id="activity-nav" class="side-nav" type="button">Activity log</button>
      <h2 class="sidebar-heading">Your chats</h2>
      <nav id="session-list" aria-label="Saved chats"></nav>
    </aside>
    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="current-title">New chat</h1>
          <p id="current-subtitle">Ask follow-ups. Answers include policy citations.</p>
        </div>
        <div class="topbar-actions">
          <label class="setting-toggle" title="Use LiteLLM for uncached messages. Usage may apply.">
            <input id="live-mode" type="checkbox" aria-label="Enable live model responses">
            <span class="toggle-track"></span>
            <span>Live</span>
          </label>
          <label class="setting-toggle" title="Switch between light and dark appearance.">
            <input id="dark-mode" type="checkbox" aria-label="Enable dark mode">
            <span class="toggle-track"></span>
            <span>Dark</span>
          </label>
          <span id="connection-status" role="status"></span>
        </div>
      </header>
      <section id="chat-log" role="log" aria-live="polite">
        <div id="empty-state">
          <h2>What would you like to know?</h2>
          <p>Ask about your policies. Continue with follow-up questions or start a new chat.</p>
        </div>
      </section>
      <form id="composer">
        <div class="composer-inner">
          <textarea
            id="message-input"
            rows="1"
            maxlength="4000"
            placeholder="Message Policy Evidence Agent..."
            aria-label="Your message"
            required
          ></textarea>
          <button id="send" type="submit">Send</button>
        </div>
        <p id="mode-hint" class="composer-hint"></p>
      </form>
    </main>
    <script>
      const newChatButton = document.querySelector("#new-chat");
      const sessionList = document.querySelector("#session-list");
      const reviewNav = document.querySelector("#review-nav");
      const reviewCount = document.querySelector("#review-count");
      const activityNav = document.querySelector("#activity-nav");
      const currentTitle = document.querySelector("#current-title");
      const currentSubtitle = document.querySelector("#current-subtitle");
      const connectionStatus = document.querySelector("#connection-status");
      const chatLog = document.querySelector("#chat-log");
      const emptyState = document.querySelector("#empty-state");
      const composer = document.querySelector("#composer");
      const messageInput = document.querySelector("#message-input");
      const sendButton = document.querySelector("#send");
      const liveModeToggle = document.querySelector("#live-mode");
      const darkModeToggle = document.querySelector("#dark-mode");
      const modeHint = document.querySelector("#mode-hint");

      let selectedSessionId = null;
      let sessions = [];
      let reviewItems = [];
      let selectedReviewId = null;
      let activeView = "chat";
      let sending = false;

      async function request(url, options = {}) {
        const response = await fetch(url, options);
        const payload = response.status === 204 ? null : await response.json();
        if (!response.ok) {
          throw new Error(payload.detail || `Request failed (${response.status})`);
        }
        return payload;
      }

      function setStatus(message, isError = false) {
        connectionStatus.textContent = message;
        connectionStatus.className = isError ? "error" : "";
      }

      function setTheme(isDark, save = true) {
        document.documentElement.dataset.theme = isDark ? "dark" : "light";
        darkModeToggle.checked = isDark;
        if (save) {
          localStorage.setItem("policyEvidenceTheme", isDark ? "dark" : "light");
        }
      }

      function updateModeHint() {
        modeHint.textContent = liveModeToggle.checked
          ? "Live mode: uncached messages call LiteLLM and save responses; usage may apply."
          : "Replay mode: use saved responses only. Enter to send, Shift+Enter for a new line.";
      }

      function renderSessions() {
        sessionList.replaceChildren();
        for (const session of sessions) {
          const row = document.createElement("div");
          row.className = "session-row";
          const button = document.createElement("button");
          button.type = "button";
          button.className = "session-button";
          if (activeView === "chat" && session.session_id === selectedSessionId) {
            button.classList.add("active");
          }
          const title = document.createElement("span");
          title.className = "session-title";
          title.textContent = session.title;
          const date = document.createElement("span");
          date.className = "session-date";
          date.textContent = new Date(session.updated_at).toLocaleString();
          button.append(title, date);
          button.addEventListener("click", () => selectSession(session.session_id));
          const remove = document.createElement("button");
          remove.type = "button";
          remove.className = "session-delete";
          remove.textContent = "Delete";
          remove.setAttribute("aria-label", `Delete chat: ${session.title}`);
          remove.addEventListener("click", () => deleteSession(session.session_id));
          row.append(button, remove);
          sessionList.append(row);
        }
        reviewNav.classList.toggle("active", activeView === "review");
        activityNav.classList.toggle("active", activeView === "activity");
      }

      function renderMessage(role, content, metadata = {}) {
        emptyState.hidden = true;
        const article = document.createElement("article");
        article.className = `message ${role}`;
        const label = document.createElement("span");
        label.className = "message-role";
        label.textContent = role === "user" ? "You" : "Agent";
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        const text = document.createElement("p");
        text.className = "message-content";
        text.textContent = content;
        bubble.append(text);

        if (role === "assistant") {
          if (metadata.status === "review") {
            addMeta(bubble, "Queued for human review. Open Human review to decide.");
          } else if (metadata.status === "approved") {
            addMeta(bubble, "Human review approved");
          } else if (metadata.status === "rejected") {
            addMeta(bubble, "Human review rejected");
          }
          if (typeof metadata.confidence === "number") {
            addMeta(bubble, `Confidence: ${(metadata.confidence * 100).toFixed(0)}%`);
          }
          if (metadata.question_id) {
            addMeta(bubble, `Reference: ${metadata.question_id}`);
          }
          for (const citation of metadata.citations || []) {
            const source = document.createElement("p");
            source.className = "citation";
            source.textContent = `${citation.passage_id}: ${citation.quote || "Policy passage cited"}`;
            bubble.append(source);
          }
        }
        article.append(label, bubble);
        chatLog.append(article);
        chatLog.scrollTop = chatLog.scrollHeight;
      }

      function addMeta(parent, content) {
        const item = document.createElement("p");
        item.className = "message-meta";
        item.textContent = content;
        parent.append(item);
      }

      async function refreshSessions() {
        const response = await request("/sessions");
        sessions = response.sessions;
        renderSessions();
      }

      async function refreshReviewCount() {
        const response = await request("/reviews");
        reviewCount.textContent = String(response.pending_count);
      }

      async function selectSession(sessionId) {
        const session = await request(`/sessions/${encodeURIComponent(sessionId)}`);
        activeView = "chat";
        selectedSessionId = session.session_id;
        localStorage.setItem("policyEvidenceSession", selectedSessionId);
        currentTitle.textContent = session.title;
        currentSubtitle.textContent = "Ask follow-ups. Answers include policy citations.";
        composer.hidden = false;
        chatLog.replaceChildren();
        emptyState.hidden = session.messages.length > 0;
        chatLog.append(emptyState);
        for (const message of session.messages) {
          renderMessage(message.role, message.content, message.metadata);
        }
        renderSessions();
        setStatus("Saved");
        messageInput.focus();
      }

      async function loadSessions(preferredId) {
        const response = await request("/sessions");
        sessions = response.sessions;
        if (sessions.length === 0) {
          const created = await request("/sessions", { method: "POST" });
          await loadSessions(created.session_id);
          return;
        }
        const remembered = localStorage.getItem("policyEvidenceSession");
        const target = sessions.find(
          (session) => session.session_id === (preferredId || remembered)
        ) || sessions[0];
        renderSessions();
        await selectSession(target.session_id);
      }

      async function deleteSession(sessionId) {
        const session = sessions.find((item) => item.session_id === sessionId);
        if (sending && sessionId === selectedSessionId) {
          setStatus("Wait for the current response before deleting this chat", true);
          return;
        }
        if (!session || !window.confirm(`Delete "${session.title}" and all its messages?`)) {
          return;
        }
        try {
          await request(`/sessions/${encodeURIComponent(sessionId)}`, { method: "DELETE" });
          await refreshSessions();
          if (sessionId === selectedSessionId) {
            localStorage.removeItem("policyEvidenceSession");
            if (sessions.length === 0) {
              const created = await request("/sessions", { method: "POST" });
              sessions = [created];
              renderSessions();
            }
            await selectSession(sessions[0].session_id);
          }
          setStatus("Chat deleted");
        } catch (error) {
          setStatus(error instanceof Error ? error.message : String(error), true);
        }
      }

      function element(tag, className, text) {
        const node = document.createElement(tag);
        if (className) {
          node.className = className;
        }
        if (text !== undefined) {
          node.textContent = text;
        }
        return node;
      }

      function renderReviewView() {
        chatLog.replaceChildren();
        const layout = element("div", "review-layout");
        const list = element("div", "review-list");
        list.setAttribute("aria-label", "Pending review items");
        if (reviewItems.length === 0) {
          list.append(element("p", "", "No answers are waiting for review."));
        }
        for (const item of reviewItems) {
          const button = element("button", "review-item");
          button.type = "button";
          button.classList.toggle("active", item.question_id === selectedReviewId);
          button.append(
            element("strong", "", item.question || "Untitled question"),
            element("span", "", `Reference: ${item.question_id}`),
          );
          button.addEventListener("click", () => {
            selectedReviewId = item.question_id;
            renderReviewView();
          });
          list.append(button);
        }
        layout.append(list);

        const detail = element("div", "review-detail");
        detail.setAttribute("aria-live", "polite");
        const item = reviewItems.find((review) => review.question_id === selectedReviewId)
          || reviewItems[0];
        if (item) {
          selectedReviewId = item.question_id;
          detail.append(
            element("h2", "", "Question"),
            element("p", "review-question", item.question || "No question text recorded."),
            element("h3", "", "Draft answer — edit before approving if needed"),
          );
          const answerInput = element("textarea");
          answerInput.id = "review-answer";
          answerInput.maxLength = 4000;
          answerInput.value = item.answer?.answer || "";
          answerInput.setAttribute("aria-label", "Draft answer for review");
          detail.append(answerInput);
          if (typeof item.grounding_f1 === "number") {
            detail.append(element("p", "message-meta", `Grounding score: ${(item.grounding_f1 * 100).toFixed(0)}%`));
          }
          for (const passage of item.passages || []) {
            detail.append(element("p", "citation", `${passage.passage_id}: ${passage.text}`));
          }
          const actions = element("div", "review-actions");
          const approve = element("button", "approve", "Approve answer");
          approve.type = "button";
          approve.addEventListener("click", () => submitReviewDecision(item, true));
          const reject = element("button", "", "Reject answer");
          reject.type = "button";
          reject.addEventListener("click", () => submitReviewDecision(item, false));
          actions.append(approve, reject);
          detail.append(actions);
        } else {
          detail.append(
            element("h2", "", "Human review"),
            element("p", "", "Review decisions are recorded in the activity log."),
          );
        }
        layout.append(detail);
        chatLog.append(layout);
      }

      async function showReviews() {
        activeView = "review";
        composer.hidden = true;
        currentTitle.textContent = "Human review";
        currentSubtitle.textContent = "Inspect uncertain answers, edit drafts, then approve or reject.";
        renderSessions();
        try {
          const result = await request("/reviews");
          reviewItems = result.reviews;
          reviewCount.textContent = String(result.pending_count);
          if (!reviewItems.some((item) => item.question_id === selectedReviewId)) {
            selectedReviewId = reviewItems[0]?.question_id || null;
          }
          renderReviewView();
          setStatus(`${result.pending_count} pending`);
        } catch (error) {
          setStatus(error instanceof Error ? error.message : String(error), true);
        }
      }

      async function submitReviewDecision(item, approved) {
        const answerInput = document.querySelector("#review-answer");
        const editedAnswer = answerInput.value.trim();
        if (approved && !editedAnswer) {
          setStatus("An approved answer cannot be blank", true);
          return;
        }
        if (!approved && !window.confirm("Reject this answer?")) {
          return;
        }
        const body = { approved };
        if (approved && editedAnswer !== item.answer?.answer) {
          body.edited_answer = editedAnswer;
        }
        try {
          await request(`/reviews/${encodeURIComponent(item.question_id)}/decision`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          selectedReviewId = null;
          setStatus(approved ? "Answer approved" : "Answer rejected");
          await showReviews();
        } catch (error) {
          setStatus(error instanceof Error ? error.message : String(error), true);
        }
      }

      async function showActivity() {
        activeView = "activity";
        composer.hidden = true;
        currentTitle.textContent = "Activity log";
        currentSubtitle.textContent = "Recent workflow, review, and chat events. Message text is not logged.";
        renderSessions();
        try {
          const response = await request("/activity?limit=100");
          chatLog.replaceChildren();
          const list = element("div", "activity-list");
          if (response.events.length === 0) {
            list.append(element("p", "", "No activity recorded yet."));
          }
          for (const event of response.events) {
            const row = element("article", "activity-row");
            row.append(
              element("strong", "", event.event_type),
              element("span", "", new Date(event.created_at).toLocaleString()),
              element(
                "span",
                "activity-event",
                [
                  event.session_id && `session=${event.session_id}`,
                  event.question_id && `reference=${event.question_id}`,
                  Object.keys(event.details || {}).length > 0
                    && JSON.stringify(event.details),
                ].filter(Boolean).join(" · ") || "No additional details",
              ),
            );
            list.append(row);
          }
          chatLog.append(list);
          setStatus(`${response.events.length} recent events`);
        } catch (error) {
          setStatus(error instanceof Error ? error.message : String(error), true);
        }
      }

      reviewNav.addEventListener("click", showReviews);
      activityNav.addEventListener("click", showActivity);

      newChatButton.addEventListener("click", async () => {
        newChatButton.disabled = true;
        try {
          const session = await request("/sessions", { method: "POST" });
          await loadSessions(session.session_id);
        } catch (error) {
          setStatus(error instanceof Error ? error.message : String(error), true);
        } finally {
          newChatButton.disabled = false;
        }
      });

      composer.addEventListener("submit", async (event) => {
        event.preventDefault();
        const content = messageInput.value.trim();
        if (!content || sending || !selectedSessionId) {
          return;
        }
        const sessionId = selectedSessionId;
        sending = true;
        sendButton.disabled = true;
        messageInput.disabled = true;
        messageInput.value = "";
        renderMessage("user", content);
        setStatus("Searching policy evidence...");
        try {
          const result = await request(
            `/sessions/${encodeURIComponent(sessionId)}/messages`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                content,
                live_mode: liveModeToggle.checked,
              }),
            },
          );
          if (selectedSessionId === sessionId) {
            renderMessage("assistant", result.message.content, result.message.metadata);
            if (result.status === "review") {
              const reviews = await request("/reviews");
              reviewItems = reviews.reviews;
              reviewCount.textContent = String(reviews.pending_count);
            }
          }
          await refreshSessions();
          setStatus("Saved");
        } catch (error) {
          if (selectedSessionId === sessionId) {
            renderMessage(
              "error",
              error instanceof Error ? error.message : String(error),
            );
          }
          setStatus("Could not complete the message", true);
        } finally {
          sending = false;
          sendButton.disabled = false;
          messageInput.disabled = false;
          messageInput.focus();
        }
      });

      messageInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          composer.requestSubmit();
        }
      });

      const savedTheme = localStorage.getItem("policyEvidenceTheme");
      setTheme(
        savedTheme === "dark" ||
          (savedTheme === null && window.matchMedia("(prefers-color-scheme: dark)").matches),
        false,
      );
      darkModeToggle.addEventListener("change", () => setTheme(darkModeToggle.checked));
      liveModeToggle.addEventListener("change", updateModeHint);
      updateModeHint();

      loadSessions().catch((error) => {
        setStatus(error instanceof Error ? error.message : String(error), true);
      });
      refreshReviewCount().catch((error) => {
        setStatus(error instanceof Error ? error.message : String(error), true);
      });
    </script>
  </body>
</html>
