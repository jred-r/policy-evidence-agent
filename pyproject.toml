[project]
name = "policy-evidence-agent"
version = "0.1.0"
description = "Evidence-grounded answers for security assessments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=3.2.1",
    "litellm>=1.60",
    "mcp>=1.6,<2",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "sentence-transformers>=3.0",
    "torch>=2.0",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
qa = "qa.cli:app"

[build-system]
requires = ["uv_build>=0.8,<0.9"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[tool.uv.build-backend]
module-name = "qa"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
